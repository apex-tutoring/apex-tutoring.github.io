<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Apex Tutoring logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#ffe29a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- the A / mountain peak -->
  <path d="M11 51 L32 11 L53 51" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="square"/>
  <!-- rising progress line as the crossbar -->
  <path d="M19 42 L27 35 L33 39 L43 29" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.5 28.5 L43.5 28.5 L43.5 34.5" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- spark at the apex -->
  <path d="M48 8 L49.6 12.4 L54 14 L49.6 15.6 L48 20 L46.4 15.6 L42 14 L46.4 12.4 Z" fill="url(#gold)"/>
</svg>
